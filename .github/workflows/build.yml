name: Compiler et publier

on:
  push:
    branches: [main]
    paths-ignore:
      - 'settings.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 manquant (voir README, étape 2)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Compiler l'APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Publier la version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ github.event.head_commit.message || 'Nouvelle version' }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk epure.apk
          TAG="v${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" epure.apk --title "Épure 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "$NOTES" \
            || gh release upload "$TAG" epure.apk --clobber
